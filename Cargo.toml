[features]
gpu=[]
scenes=[]

[[bench]]
name = "bvh"
harness = false

[package]
name = "ray_tracer"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0.100"
bytemuck = "1.24.0"
encase = "0.12.0"
env_logger = "0.11.8"
rand = "0.9.2"
pollster = {version = "0.4.0", features = ["macro"]}
wgpu = { version = "27.0.1" }
winit = { version = "0.30.12" }
obj-rs = "0.7.4"
image = "0.25.9"

[dev-dependencies]
criterion = { version = "0.8.2", features = ["html_reports"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.profiling]
inherits = "release"
debug = true
